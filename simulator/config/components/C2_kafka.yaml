id: C2
name: DMS for Kafka
resources:
  instance:
  - instance
  broker:
  - broker1
  - broker2
  - broker3
  topic:
  - telemetry.metrics.dws.v1
  consumer group:
  - telemetry-metrics-consumer
metrics:
- id: current_partitions
  name: Partitions
  namespace: SYS.DMS
  level: instance
  unit: count
  official_range:
  - 0.0
  - 100000.0
  period_min: 1
  decimals: 0
  kind: constant
  value: 6
- id: current_topics
  name: Topics
  namespace: SYS.DMS
  level: instance
  unit: count
  official_range:
  - 0.0
  - 100000.0
  period_min: 1
  decimals: 0
  kind: constant
  value: 1
- id: group_msgs
  name: Accumulated Messages
  namespace: SYS.DMS
  level: instance
  unit: count
  official_range:
  - 0.0
  - 1000000000.0
  period_min: 1
  decimals: 0
  kind: derived
  expr: ref('consumer group', 'consumer_messages_remained')
- id: instance_bytes_in_rate
  name: Message Production
  namespace: SYS.DMS
  level: instance
  unit: byte/s
  official_range:
  - 0.0
  - 1000000.0
  period_min: 1
  decimals: 2
  kind: random
  normal:
  - 2000.0
  - 3000.0
  bad:
  - 250.0
  - 1000.0
- id: instance_bytes_out_rate
  name: Message Consumption
  namespace: SYS.DMS
  level: instance
  unit: byte/s
  official_range:
  - 0.0
  - 1000000.0
  period_min: 1
  decimals: 2
  kind: random
  normal:
  - 2000.0
  - 3000.0
  bad:
  - 250.0
  - 1000.0
- id: current_partitions_usage
  name: Current Partitions Usage
  namespace: SYS.DMS
  level: instance
  unit: '%'
  official_range:
  - 0.0
  - 100.0
  period_min: 1
  decimals: 2
  kind: constant
  value: 0.6
- id: instance_disk_usage
  name: Instance Disk Usage
  namespace: SYS.DMS
  level: instance
  unit: '%'
  official_range:
  - 0.0
  - 100.0
  period_min: 1
  decimals: 2
  kind: derived
  expr: avg('broker', 'broker_disk_usage')
- id: broker_data_size
  name: Message Size
  namespace: SYS.DMS
  level: broker
  unit: byte
  official_range:
  - 0.0
  - 5000000000000.0
  period_min: 1
  decimals: 2
  kind: random
  normal:
  - 100000000.0
  - 300000000.0
  bad:
  - 4000000000.0
  - 6000000000.0
- id: broker_messages_in_rate
