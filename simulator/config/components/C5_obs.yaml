- id: request_success_rate
  name: Request Success Rate
  namespace: SYS.OBS
  level: bucket
  unit: '%'
  official_range:
  - 0.0
  - 100.0
  period_min: 1
  decimals: 2
  kind: derived
  expr: 100 * (1 - (request_count_4xx + request_count_5xx) / (get_request_count + put_request_count + post_request_count + head_request_count + delete_request_count))
- id: effective_request_rate
  name: Valid Request Rate
  namespace: SYS.OBS
  level: bucket
  unit: '%'
  official_range:
  - 0.0
  - 100.0
  period_min: 1
  decimals: 2
  kind: derived
  expr: 100 * (1 - request_count_4xx / (get_request_count + put_request_count + post_request_count + head_request_count + delete_request_count))
- id: request_break_rate
  name: Request Interruption Rate
  namespace: SYS.OBS
  level: bucket
  unit: '%'
  official_range:
  - 0.0
  - 100.0
  period_min: 1
  decimals: 2
  kind: random
  normal:
