- id: request_count_per_second
  name: Total QPS
  namespace: SYS.OBS
  level: bucket
  unit: count/s
  official_range:
  - 0.0
  - null
  period_min: 1
  decimals: 2
  kind: derived
  expr: (get_request_count + put_request_count + post_request_count + head_request_count + delete_request_count) / 60
- id: request_count_get_per_second
  name: GET Request QPS
  namespace: SYS.OBS
  level: bucket
  unit: count/s
  official_range:
  - 0.0
  - null
  period_min: 1
  decimals: 2
